name: Release

on:
  push:
    tags:
      - "v*"

env:
  CARGO_TERM_COLOR: always

jobs:
  create-release:
    runs-on: ubuntu-latest
    outputs:
      tag_name: ${{ steps.tag.outputs.tag_name }}
    steps:
      - uses: actions/checkout@v5

      - name: Get tag name
        id: tag
        run: echo "tag_name=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT

      - name: Create Release
        run: |
          gh release create ${{ steps.tag.outputs.tag_name }} \
            --title "Release ${{ steps.tag.outputs.tag_name }}" \
            --generate-notes \
            --draft=false \
            --prerelease=false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-deb:
    needs: create-release
    name: Build .deb (Ubuntu 26.04)
    runs-on: ubuntu-latest
    container:
      image: ubuntu:26.04

    steps:
      - uses: actions/checkout@v5

      - name: Install build dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            curl ca-certificates build-essential pkg-config \
            libdbus-1-dev

      - name: Install Rust toolchain
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs \
            | sh -s -- -y --profile minimal --default-toolchain stable
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Cache Cargo artefacts
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: deb-ubuntu2604-cargo-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            deb-ubuntu2604-cargo-

      - name: Build (release)
        run: cargo build --release --locked

      - name: Build .deb
        run: bash contrib/debian/build-deb.sh

      - name: Upload .deb to release
        run: |
          gh release upload ${{ needs.create-release.outputs.tag_name }} \
            vpn-jumphost_*_amd64.deb
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-macos-pkg:
    needs: create-release
    name: Build .pkg (macOS)
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v5

      - name: Install Rust toolchain
        run: |
          rustup update stable
          rustup default stable

      - name: Cache Cargo artefacts
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: macos-pkg-cargo-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            macos-pkg-cargo-

      - name: Build (release)
        run: cargo build --release --locked

      - name: Build .pkg
        run: bash contrib/macos/build-pkg.sh

      - name: Upload .pkg to release
        run: |
          gh release upload ${{ needs.create-release.outputs.tag_name }} \
            vpn-jumphost-*.pkg
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
