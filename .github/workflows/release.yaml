name: Release

on:
  push:
    branches: [main]
    tags:
      - "v*"
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  build-deb:
    name: Build .deb (Ubuntu 26.04)
    runs-on: ubuntu-latest
    container:
      image: ubuntu:26.04

    steps:
      - uses: actions/checkout@v5

      - name: Install build dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            curl ca-certificates build-essential pkg-config \
            libdbus-1-dev

      - name: Install Rust toolchain
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs \
            | sh -s -- -y --profile minimal --default-toolchain stable
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Cache Cargo artefacts
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: deb-ubuntu2604-cargo-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            deb-ubuntu2604-cargo-

      - name: Build (release)
        run: cargo build --release --locked

      - name: Build .deb
        run: bash contrib/debian/build-deb.sh

      - name: Upload .deb artefact
        uses: actions/upload-artifact@v5
        with:
          name: vpn-jumphost-deb
          path: "vpn-jumphost_*_amd64.deb"

  build-macos-pkg:
    name: Build .pkg (macOS)
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v5

      - name: Install Rust toolchain
        run: |
          rustup update stable
          rustup default stable

      - name: Cache Cargo artefacts
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: macos-pkg-cargo-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            macos-pkg-cargo-

      - name: Build (release)
        run: cargo build --release --locked

      - name: Build .pkg
        run: bash contrib/macos/build-pkg.sh

      - name: Upload .pkg artefact
        uses: actions/upload-artifact@v5
        with:
          name: vpn-jumphost-macos-pkg
          path: "vpn-jumphost-*.pkg"

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build-deb, build-macos-pkg]
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Get tag name
        id: tag
        run: echo "tag_name=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT

      - name: Download artefacts
        uses: actions/download-artifact@v5
        with:
          path: artefacts

      - name: Create release and upload packages
        run: |
          gh release create ${{ steps.tag.outputs.tag_name }} \
            --title "Release ${{ steps.tag.outputs.tag_name }}" \
            --generate-notes \
            --draft=false \
            --prerelease=false \
            artefacts/vpn-jumphost-deb/*.deb \
            artefacts/vpn-jumphost-macos-pkg/*.pkg
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
