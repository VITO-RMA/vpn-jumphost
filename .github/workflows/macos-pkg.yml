name: Build macOS package

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pkg:
    name: Build .pkg (macOS)
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v5

      - name: Install Rust toolchain
        run: |
          rustup update stable
          rustup default stable

      - name: Cache Cargo artefacts
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: macos-pkg-cargo-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            macos-pkg-cargo-

      - name: Build (release)
        run: cargo build --release --locked

      - name: Run tests
        run: cargo test --release --locked

      - name: Build .pkg
        run: bash contrib/macos/build-pkg.sh

      - name: Upload .pkg artefact
        uses: actions/upload-artifact@v5
        with:
          name: vpn-jumphost-macos-pkg
          path: "vpn-jumphost-*.pkg"
