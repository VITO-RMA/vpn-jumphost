name: Build macOS package

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pkg:
    name: Build .pkg (macOS)
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v5

      - name: Install Rust toolchain
        run: |
          rustup update stable
          rustup default stable

      - name: Cache Cargo artefacts
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: macos-pkg-cargo-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            macos-pkg-cargo-

      - name: Build (release)
        run: cargo build --release --locked

      - name: Run tests
        run: cargo test --release --locked

      - name: Read package version
        id: meta
        run: |
          version=$(grep '^version' Cargo.toml | head -1 | sed 's/.*"\(.*\)".*/\1/')
          arch=$(uname -m)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "arch=$arch" >> "$GITHUB_OUTPUT"
          echo "Package version: $version ($arch)"

      - name: Build .pkg
        run: bash contrib/macos/build-pkg.sh

      - name: Verify .pkg
        run: |
          pkg="vpn-jumphost-${{ steps.meta.outputs.version }}-${{ steps.meta.outputs.arch }}.pkg"
          pkgutil --payload-files "$pkg"
          echo ""
          echo "Package: $pkg"
          ls -lh "$pkg"

      - name: Upload .pkg artefact
        uses: actions/upload-artifact@v5
        with:
          name: vpn-jumphost-macos-${{ steps.meta.outputs.arch }}
          path: "vpn-jumphost-${{ steps.meta.outputs.version }}-${{ steps.meta.outputs.arch }}.pkg"
