name: Build Debian package

on:
  push:
    branches: [main]
  pull_request:

jobs:
  deb:
    name: Build .deb (Ubuntu 26.04)
    runs-on: ubuntu-latest
    container:
      image: ubuntu:26.04

    steps:
      - uses: actions/checkout@v5

      - name: Install build dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            curl ca-certificates build-essential pkg-config \
            libdbus-1-dev

      - name: Install Rust toolchain
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs \
            | sh -s -- -y --profile minimal --default-toolchain stable
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Cache Cargo artefacts
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: deb-ubuntu2604-cargo-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            deb-ubuntu2604-cargo-

      - name: Build (release)
        run: cargo build --release --locked

      - name: Run tests
        run: cargo test --release --locked

      - name: Build .deb
        run: bash contrib/debian/build-deb.sh

      - name: Upload .deb artefact
        uses: actions/upload-artifact@v5
        with:
          name: vpn-jumphost-deb
          path: "vpn-jumphost_*_amd64.deb"
