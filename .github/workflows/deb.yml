name: Build Debian package

on:
  push:
    branches: [main]
  pull_request:

jobs:
  deb:
    name: Build .deb (Ubuntu 26.04)
    runs-on: ubuntu-latest
    container:
      image: ubuntu:26.04

    steps:
      - uses: actions/checkout@v5

      - name: Install build dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            curl ca-certificates build-essential pkg-config

      - name: Install Rust toolchain
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs \
            | sh -s -- -y --profile minimal --default-toolchain stable
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Cache Cargo artefacts
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: deb-ubuntu2604-cargo-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            deb-ubuntu2604-cargo-

      - name: Build (release)
        run: cargo build --release --locked

      - name: Run tests
        run: cargo test --release --locked

      - name: Read package version
        id: meta
        run: |
          version=$(grep '^version' Cargo.toml | head -1 | sed 's/.*"\(.*\)".*/\1/')
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Package version: $version"

      - name: Stage package tree
        run: |
          pkg=pkg-root
          mkdir -p "$pkg/DEBIAN"
          mkdir -p "$pkg/usr/bin"
          mkdir -p "$pkg/usr/lib/systemd/user"
          mkdir -p "$pkg/usr/share/vpn-jumphost"
          mkdir -p "$pkg/usr/share/doc/vpn-jumphost"

          cp contrib/debian/control    "$pkg/DEBIAN/control"
          install -m 755 contrib/debian/postinst "$pkg/DEBIAN/postinst"
          install -m 755 contrib/debian/prerm    "$pkg/DEBIAN/prerm"
          install -m 755 contrib/debian/postrm   "$pkg/DEBIAN/postrm"

          install -m 755 target/release/jumphost              "$pkg/usr/bin/jumphost"
          install -m 644 contrib/debian/vpn-jumphost.service   "$pkg/usr/lib/systemd/user/vpn-jumphost.service"
          install -m 644 docs/config.example.toml              "$pkg/usr/share/vpn-jumphost/config.example.toml"
          install -m 644 README.md                             "$pkg/usr/share/doc/vpn-jumphost/README.md"
          install -m 644 spec.md                               "$pkg/usr/share/doc/vpn-jumphost/spec.md"
          install -m 644 docs/architecture.md                  "$pkg/usr/share/doc/vpn-jumphost/architecture.md"
          install -m 644 docs/ssh.md                           "$pkg/usr/share/doc/vpn-jumphost/ssh.md"

      - name: Build .deb
        run: |
          dpkg-deb --build pkg-root "vpn-jumphost_${{ steps.meta.outputs.version }}_amd64.deb"

      - name: Verify .deb
        run: |
          dpkg-deb --info "vpn-jumphost_${{ steps.meta.outputs.version }}_amd64.deb"
          dpkg-deb --contents "vpn-jumphost_${{ steps.meta.outputs.version }}_amd64.deb"

      - name: Upload .deb artefact
        uses: actions/upload-artifact@v5
        with:
          name: vpn-jumphost-deb
          path: "vpn-jumphost_${{ steps.meta.outputs.version }}_amd64.deb"
