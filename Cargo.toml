[package]
name = "vpn-jumphost"
version = "0.2.0"
edition = "2024"
description = "VPN jumphost: OpenConnect+ocproxy supervisor, routing SOCKS5 proxy, PAC server, and F5 cookie management (pure Rust, no Python)."
license = "MIT"

[[bin]]
name = "jumphost"
path = "src/main.rs"

[dependencies]
anyhow = "1"
bytes = "1"
chromiumoxide = { version = "0.9", default-features = false }
clap = { version = "4", features = ["derive", "env"] }
clap_complete = "4"
directories = "6"
dotenvy = "0.15"
futures-util = "0.3"
http-body-util = "0.1"
hyper = { version = "1", features = ["http1", "server"] }
hyper-util = { version = "0.1", features = ["tokio"] }
keyring-core = "1"
nix = { version = "0.31", features = ["process", "signal"] }
reqwest = "0.13"
rpassword = "7"
serde = { version = "1", features = ["derive"] }
thiserror = "2"
time = { version = "0.3", features = ["formatting", "local-offset", "macros"] }
tokio = {
  version = "1",
  features = [
    "io-util",
    "macros",
    "net",
    "process",
    "rt-multi-thread",
    "signal",
    "sync",
    "time",
  ]
}
tokio-util = "0.7"
toml = "1"
tracing = "0.1"
tracing-subscriber = {
  version = "0.3",
  features = [
    "ansi",
    "chrono",
    "env-filter",
  ]
}

notify-rust = "4"
zbus = { version = "5", default-features = false, features = ["tokio"] }

# Linux-only: dbus-based Secret Service keyring store.
[target.'cfg(target_os = "linux")'.dependencies]
dbus-secret-service-keyring-store = {
  version = "1",
  features = [
    "crypto-rust",
  ]
}

# macOS-only: Cocoa bindings for NSWorkspaceDidWakeNotification.
[target.'cfg(target_os = "macos")'.dependencies]
apple-native-keyring-store = { version = "1", features = ["keychain"] }
block2 = "0.6"
objc2 = "0.6"
objc2-app-kit = { version = "0.3", features = ["NSResponder", "NSWorkspace"] }
objc2-foundation = {
  version = "0.3",
  features = [
    "NSDate",
    "NSNotification",
    "NSObjCRuntime",
    "NSObject",
    "NSOperation",
    "NSRunLoop",
    "NSString",
    "NSThread",
    "block2",
  ]
}

[profile.release]
strip = true
lto = true
